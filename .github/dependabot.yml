version: 2
updates:
  # Dev container features in .devcontainer/devcontainer.json and its lockfile.
  # kind and kubectl are pinned in .devcontainer/Dockerfile and updated by hand.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
  # Actions in .github/workflows are pinned to commits; the comment after each
  # one names the release, and both are updated together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
