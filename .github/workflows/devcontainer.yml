name: Dev container

# Builds the dev container as a person's machine does, checks it and runs the
# e2e tests inside it. This does not run on every push: only when something the container depends on changes, and
# weekly to catch breakage from outside the repository (base image, features,
# browser dependencies).
on:
  push:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - e2e/**
      - examples/**
      - vitest.config.ts
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # arm64 is what Docker builds on Apple Silicon. Features and the
        # Dockerfile download different binaries there.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that tool versions match the project
        run: |
          node_version="$(cat .node-version)"
          pnpm_version="$(jq -r .packageManager package.json | sed -e 's/^pnpm@//' -e 's/+.*$//')"
          grep -Fq "\"version\": \"${node_version}\"" .devcontainer/devcontainer.json ||
            { echo "::error::devcontainer.json does not install Node ${node_version} (.node-version)"; exit 1; }
          grep -Fq "\"pnpmVersion\": \"${pnpm_version}\"" .devcontainer/devcontainer.json ||
            { echo "::error::devcontainer.json does not install pnpm ${pnpm_version} (package.json)"; exit 1; }
      # The same commands as in the README, so that the container is created
      # the way it is on a person's machine and stays up for the later steps.
      - name: Install the Dev Containers CLI
        run: npm install -g @devcontainers/cli@0
      - name: Create the container
        run: devcontainer up --workspace-folder .
      # docker exec, not devcontainer exec: the latter passes on the
      # environment of a login shell, which would hide a tool that only a
      # login shell finds.
      - name: Check the container as its user
        run: |
          container="$(docker ps -q --filter "label=devcontainer.local_folder=${GITHUB_WORKSPACE}")"
          docker exec -u vscode "${container}" "/workspaces/${GITHUB_WORKSPACE##*/}/.devcontainer/check-container.sh"
      - name: Run the e2e tests
        run: >-
          devcontainer exec --workspace-folder . bash -c
          'pnpm e2e:up && pnpm test:e2e && pnpm test:oidc && pnpm test:demo && pnpm test:e2e:faults'
