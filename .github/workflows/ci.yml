name: CI

# Branches of this repository are checked when they are pushed. Pull requests
# from forks never push here, so those are checked as pull requests. So is the
# "Version Packages" pull request: the Release workflow pushes its branch, and
# pushes made by a workflow do not start other workflows. GitHub holds the run
# for that pull request until a maintainer approves it.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm demo:build

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e:up
      - run: pnpm test:e2e
      - run: pnpm test:demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: demo-screenshots
          path: examples/demo/screenshots
          if-no-files-found: ignore
      - run: pnpm test:e2e:faults
      - name: Dump API server flags and logs
        if: failure()
        run: |
          kubectl --context kind-kube-client-web -n kube-system get pods -o wide || true
          kubectl --context kind-kube-client-web -n kube-system logs -l component=kube-apiserver --tail=100 || true
