name: CI

# Branches of this repository are checked when they are pushed. Pull requests
# from forks never push here, so those are checked as pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm demo:build

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e:up
      - run: pnpm test:e2e
      - run: pnpm test:demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-screenshots
          path: examples/demo/screenshots
          if-no-files-found: ignore
      - run: pnpm test:e2e:faults
      - name: Dump API server flags and logs
        if: failure()
        run: |
          kubectl --context kind-kube-client-web -n kube-system get pods -o wide || true
          kubectl --context kind-kube-client-web -n kube-system logs -l component=kube-apiserver --tail=100 || true
