# Identity used by the browser e2e tests. Read-only access to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-client-web-e2e
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-client-web-e2e-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kube-client-web-e2e
    namespace: default
