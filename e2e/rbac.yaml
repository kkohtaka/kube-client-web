# Identities used by the browser e2e tests: read-only access to the cluster,
# and write access inside a dedicated namespace. One is a ServiceAccount; the
# other is the user who signs in through Dex (see dex.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: kube-client-web-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-client-web-e2e
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-client-web-e2e-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kube-client-web-e2e
    namespace: default
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: oidc:jane@example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-client-web-e2e-edit
  namespace: kube-client-web-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: kube-client-web-e2e
    namespace: default
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: oidc:jane@example.com
---
# The built-in "edit" role does not cover custom resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-client-web-e2e-widgets
  namespace: kube-client-web-e2e
rules:
  - apiGroups: ["e2e.kube-client-web.test"]
    resources: ["widgets", "widgets/status"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-client-web-e2e-widgets
  namespace: kube-client-web-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-client-web-e2e-widgets
subjects:
  - kind: ServiceAccount
    name: kube-client-web-e2e
    namespace: default
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: oidc:jane@example.com
