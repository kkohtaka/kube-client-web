# Dex, the OpenID Connect provider of the e2e cluster. It knows one user and
# one public client, and keeps everything in memory.
#
# The user's password is "password". This is a fixture for a cluster that only
# listens on 127.0.0.1; never run it anywhere else.
apiVersion: v1
kind: Namespace
metadata:
  name: dex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
data:
  config.yaml: |
    issuer: https://127.0.0.1:5556/dex
    storage:
      type: memory
    web:
      https: 0.0.0.0:5556
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
      # Lets pages read the configuration and call the token endpoint.
      allowedOrigins: ["*"]
    oauth2:
      skipApprovalScreen: true
      # Lets cluster-up.sh get a token without a browser.
      passwordConnector: local
    expiry:
      idTokens: 10m
    staticClients:
      # A public client: no secret, and any http://localhost redirect is allowed.
      - id: kube-client-web
        name: kube-client-web e2e
        public: true
    enablePasswordDB: true
    staticPasswords:
      - email: jane@example.com
        username: jane
        userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
        # bcrypt of "password"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  replicas: 1
  # The port on the node can only be held by one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      hostNetwork: true
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config/config.yaml"]
          ports:
            - containerPort: 5556
          readinessProbe:
            httpGet:
              path: /dex/healthz
              port: 5556
              scheme: HTTPS
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config
            - name: tls
              mountPath: /etc/dex/tls
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tls
          secret:
            secretName: dex-tls
